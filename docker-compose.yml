services:
  transcribe-api:
    build: .
    image: transcribe-api:latest
    container_name: transcribe-api
    ports:
      - "8000:8000"
    volumes:
      # Cache modelli persistente tra i riavvii del container
      - model_cache:/app/.cache
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  model_cache:
